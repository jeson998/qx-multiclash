# ===================================================================
# Quantumult X 配置模板
# 把 jeson998/qx-multiclash 换成你自己的 GitHub 账号和仓库名
# ===================================================================

[general]
network_check_url=http://www.gstatic.com/generate_204
server_check_url=http://www.gstatic.com/generate_204
dns-server=223.5.5.5, 119.29.29.29
# 自定义 GeoIP 库（可选，不同 QX 版本参数名有差异，确认后再启用）
# geoip-url=https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country.mmdb

[policy]
static=国内 = direct, proxy
static=国外 = proxy
static=Bypass = direct

[server_local]
# 节点写这里，或用 [server_remote] 引订阅

[server_remote]
# https://your-sub-url, tag=机场, update-interval=86400, enabled=true

# -------------------------------------------------------------------
# 顺序即优先级：排在前面的规则先匹配
# -------------------------------------------------------------------
[filter_remote]
# --- 上游国内大集合（已按 QX 语法）---
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/ChinaMax/ChinaMax.list, tag=CN-Domain, force-policy=direct, update-interval=86400
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/ChinaIPs/ChinaIPs.list, tag=CN-IP, force-policy=direct, update-interval=86400
# --- 自维护（由 Actions 从 src/*.list 转译）---
https://raw.githubusercontent.com/jeson998/qx-multiclash/main/dist/qx/bypass.list, tag=APP-Bypass, force-policy=direct, update-interval=86400
https://raw.githubusercontent.com/jeson998/qx-multiclash/main/dist/qx/cn.list,     tag=MY-CN,      force-policy=direct, update-interval=86400
https://raw.githubusercontent.com/jeson998/qx-multiclash/main/dist/qx/proxy.list,  tag=MY-Proxy,   force-policy=proxy,  update-interval=86400
# --- 广告 ---
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Advertising/Advertising.list, tag=AD, force-policy=reject, update-interval=86400

[filter_local]
# 局域网
ip-cidr, 192.168.0.0/16, direct, no-resolve
ip-cidr, 10.0.0.0/8, direct, no-resolve
ip-cidr, 172.16.0.0/12, direct, no-resolve
ip-cidr, 100.64.0.0/10, direct, no-resolve
ip-cidr, 169.254.0.0/16, direct, no-resolve
host-suffix, lan, direct
host-suffix, local, direct
# 国内域名后缀先拦截，防止 DNS 污染导致 geoip 误判
host-suffix, cn, direct
# 国内 IP 兜底
geoip, cn, direct
# 最终兜底
final, proxy

[rewrite_local]
# 按需添加，例：
# ^https?:\/\/(www\.)?example\.com\/ads url reject

[rewrite_remote]
# https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rewrite/QuantumultX/Advertising/Advertising.conf, tag=AD-Rewrite, update-interval=86400, enabled=true

[task_local]
# 0 3 * * * https://raw.githubusercontent.com/jeson998/qx-multiclash/main/scripts/xxx.js, tag=定时任务, enabled=true

[mitm]
# 仅在做 HTTPS 重写时才需要，按需启用
# hostname = %APPEND% *.example.com
